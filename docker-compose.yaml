version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adr_nlp_api_serving
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_CLOUD_PROJECT=project-edc577ab-2a6a-4016-89e
    volumes:
      - ~/.config/gcloud:/root/.config/gcloud:ro
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: adr_nlp_telemetry_prometheus
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: adr_nlp_visualization_grafana
    ports:
      - "3000:3000"  # Exposes the Grafana UI to your local browser
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: always

volumes:
  grafana_data:


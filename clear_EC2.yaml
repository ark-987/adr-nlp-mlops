      - name: SSH into EC2 and Force Reinstall Compose
        uses: appleboy/ssh-action@master
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_ACCOUNT_ID
          script: |
            # 1. Force the remote environment to find system binaries
            export PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
            
            # 2. CLEAR THE TRAP: Wipe out the corrupted HTML files completely
            sudo rm -f /usr/local/bin/docker-compose /usr/bin/docker-compose
            
            # 3. DOWNLOAD THE REAL BINARY: Pull the true Linux executable asset
            echo "Downloading clean standalone compose engine binary..."
            sudo curl -SL "https://github.com" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            sudo ln -sf /usr/local/bin/docker-compose /usr/bin/docker-compose
            
            # 4. AUTHENTICATE REGISTRY
            TARGET_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.eu-north-1.amazonaws.com"
            echo "Authenticating Docker against remote ECR Registry..."
            aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin $TARGET_REGISTRY
            
            # 5. REFRESH CONTAINERS
            export ECR_REGISTRY=$TARGET_REGISTRY
            echo "Executing application container refresh..."
            docker-compose down
            docker-compose pull
            docker-compose up -d

name: MLOps Continuous Integration & Deployment

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


env:
  AWS_REGION: eu-north-1
  API_IMAGE: adr-nlp-api
  FRONTEND_IMAGE: adr-nlp-frontend


jobs:

  # ==========================================================
  # 1. CODE QUALITY + TESTING
  # ==========================================================

  code-quality-and-test:

    runs-on: ubuntu-latest

    env:
      SKIP_MODEL_BOOTSTRAP: "1"  # Prevent heavy model download/extraction during unit tests

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.10"
          cache: pip


      - name: Print runner disk usage (before installs)
        run: |
          df -h /
          df -h /tmp || true
          echo "Disk usage (top-level):"
          du -sh . || true

      - name: Install dependencies (with explicit tokenizer installs + debug)

        run: |
          set -eux
          python -m pip install --upgrade pip

          pip install flake8 pytest

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f requirements_dev.txt ]; then
            pip install -r requirements_dev.txt
          fi

          # Explicitly ensure tokenizer conversion deps are present and show versions
          pip install --no-cache-dir "sentencepiece>=0.1.99"
          pip install --no-cache-dir "tiktoken>=0.4.0"

          echo "---- pip freeze (show installed tokenizer-related packages) ----"
          pip freeze | sed -n '/sentencepiece/,/tiktoken/p' || pip freeze | grep -E 'sentencepiece|tiktoken' || true

          echo "---- Disk usage (after installs) ----"
          df -h /
          df -h /tmp || true
          du -sh . || true


      - name: Run flake8

        run: |

          flake8 src/ \
          --count \
          --select=E9,F63,F7,F82 \
          --show-source \
          --statistics


      - name: Run tests

        env:

          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}

          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          AWS_DEFAULT_REGION: eu-north-1

          HF_HUB_OFFLINE: "1"

          TRANSFORMERS_OFFLINE: "1"


        run: |

          export PYTHONPATH="."

          pytest



  # ==========================================================
  # 2. BUILD + PUSH DOCKER IMAGES TO ECR
  # ==========================================================


  build-and-push:

    needs: code-quality-and-test

    if: github.event_name == 'push'

    runs-on: ubuntu-latest


    steps:


      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: eu-north-1



      - name: Login to Amazon ECR

        id: ecr

        uses: aws-actions/amazon-ecr-login@v2



      - name: Build and push API image

        env:

          REGISTRY: ${{ steps.ecr.outputs.registry }}

        run: |


          docker build \
          -t $REGISTRY/${{ env.API_IMAGE }}:latest \
          .


          docker push \
          $REGISTRY/${{ env.API_IMAGE }}:latest




      - name: Build and push Frontend image

        env:

          REGISTRY: ${{ steps.ecr.outputs.registry }}

        run: |


          docker build \
          -f Dockerfile.frontend \
          -t $REGISTRY/${{ env.FRONTEND_IMAGE }}:latest \
          .


          docker push \
          $REGISTRY/${{ env.FRONTEND_IMAGE }}:latest





  # ==========================================================
  # 3. DEPLOY TO EC2
  # ==========================================================


  deploy-to-ec2:


    needs: build-and-push

    runs-on: ubuntu-latest



    steps:


      - name: Checkout repository

        uses: actions/checkout@v4




      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: eu-north-1




      - name: Copy deployment files to EC2


        uses: appleboy/scp-action@v0.1.7


        with:


          host: ${{ secrets.EC2_HOST }}

          username: ubuntu

          key: ${{ secrets.EC2_SSH_KEY }}


          source: |

            docker-compose.yaml

            config/prometheus.yaml


          target: /home/ubuntu




      - name: Restart production stack


        uses: appleboy/ssh-action@v1.0.3


        with:


          host: ${{ secrets.EC2_HOST }}

          username: ubuntu

          key: ${{ secrets.EC2_SSH_KEY }}


          script: |


            export AWS_REGION=eu-north-1


            export AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}


            export ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com



            cd /home/ubuntu



            echo "Logging into ECR"


            aws ecr get-login-password \
            --region $AWS_REGION \
            | docker login \
            --username AWS \
            --password-stdin $ECR_REGISTRY




            echo "Stopping old containers"


            docker compose down





            echo "Pulling latest images"


            docker compose pull





            echo "Starting production stack"


            docker compose up -d




            echo "Deployment complete"


            docker ps

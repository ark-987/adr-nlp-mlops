name: CI/CD Deployment

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # FIXED: Uses alternative tool (wget) and applies a strict regex filter to catch ONLY valid IPs
      - name: Get Runner IP
        id: ip
        run: |
          RAW_IP=$(wget -qO- https://amazonaws.com || curl -s https://icanhazip.com)
          CLEAN_IP=$(echo "$RAW_IP" | grep -E -o "([0-3]?[0-9]{1,2}\.){3}[0-3]?[0-9]{1,2}" | head -n 1)
          
          if [ -z "$CLEAN_IP" ]; then
            echo "Error: Could not resolve a valid IPv4 address string."
            exit 1
          fi
          
          echo "ipv4=$CLEAN_IP" >> $GITHUB_OUTPUT

      - name: Whitelist Runner IP
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32 || true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-north-1

      - name: SSH into EC2 and Refresh Containers
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_ACCOUNT_ID
          script: |
            export PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
            
            sudo rm -f /usr/local/bin/docker-compose /usr/bin/docker-compose
            
            echo "Downloading clean standalone compose engine binary..."
            sudo curl -SL "https://github.com" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            sudo ln -sf /usr/local/bin/docker-compose /usr/bin/docker-compose
            
            TARGET_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.eu-north-1.amazonaws.com"
            
            echo "Authenticating Docker against remote ECR Registry..."
            aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin $TARGET_REGISTRY
            
            export ECR_REGISTRY=$TARGET_REGISTRY
            
            echo "Executing application container refresh via standalone compose engine..."
            docker-compose down
            docker-compose pull
            docker-compose up -d

      - name: Revoke Runner IP Access
        if: always() && steps.ip.outputs.ipv4 != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-north-1

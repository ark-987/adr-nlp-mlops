name: CI/CD Deployment

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # STEP 1: Bulletproof Multi-Service Fallback IP Resolver
      - name: Get Runner IP
        id: ip
        run: |
          echo "Resolving runner public IP address..."
          CLEAN_IP=""
          
          SERVICES=(
            "https://icanhazip.com"
            "https://checkip.amazonaws.com"
            "https://ifconfig.me/ip"
          )
          
          for url in "${SERVICES[@]}"; do
            echo "Attempting to fetch IP from $url..."
            RAW_IP=$(curl -s --connect-timeout 5 --max-time 10 "$url" || wget -qO- --timeout=5 "$url" || true)
            VALIDATED_IP=$(echo "$RAW_IP" | grep -E -o "([0-9]{1,3}\.){3}[0-9]{1,3}" | head -n 1)
            
            if [ ! -z "$VALIDATED_IP" ]; then
              CLEAN_IP=$VALIDATED_IP
              echo "Successfully resolved IP: $CLEAN_IP"
              break
            fi
            echo "Warning: Service $url failed. Trying next..."
          done
          
          if [ -z "$CLEAN_IP" ]; then
            echo "Error: All IP discovery services failed."
            exit 1
          fi
          
          echo "ipv4=$CLEAN_IP" >> $GITHUB_OUTPUT

      # STEP 2: Open firewall port 22 for this runner
      - name: Whitelist Runner IP
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32 || true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-north-1

      # STEP 3: Securely execute remote commands with explicit arguments
      - name: SSH into EC2 and Refresh Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_ACCOUNT_ID
          script: |
            export PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
            export AWS_ACCOUNT_ID="${{ secrets.AWS_ACCOUNT_ID }}"
            
            sudo rm -f /usr/local/bin/docker-compose /usr/bin/docker-compose
            
            echo "Downloading clean standalone compose engine binary..."
            sudo curl -SL "https://github.com/docker/compose/releases/download/v2.27.1/docker-compose-linux-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            sudo ln -sf /usr/local/bin/docker-compose /usr/bin/docker-compose
            
            TARGET_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.eu-north-1.amazonaws.com"
            
            echo "Authenticating Docker against remote ECR Registry..."
            aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin $TARGET_REGISTRY
            
            export ECR_REGISTRY=$TARGET_REGISTRY
            
            echo "Executing application container refresh via standalone compose engine..."
            docker-compose down
            docker-compose pull
            docker-compose up -d

      # STEP 4: Always lock the firewall door back down
      - name: Revoke Runner IP Access
        if: always() && steps.ip.outputs.ipv4 != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-north-1
project:
  name: adr-nlp

# stages of data handling:
# - ingestion
# - validation
# - preprocessing
# - training
# - evaluation
# - explainability

paths:
  raw_data: 
    train: "data/processed/train.csv"
    val: "data/processed/val.csv"
    test: "data/processed/test.csv"
  interim_data: data/pre_process/
  processed_data: data/processed/
  models: "./final_production_model"

dataset:
  name: "jessicali9530/kuc-hackathon-winter-2018"
  train_file: "drugsComTrain_raw.csv"
  target_column: "adr_label"
  text_column: "review"


split:
  test_size: 0.1
  val_size: 0.1
  random_state: 42  # Good practice to keep this in config for reproducibility

agent:
  enabled: true
  lowercase: false      # Added to match your CleaningAgent logic
  remove_punctuation: false
  remove_noise_chars: true  # TRUE to remove actual junk like emojis/icons
 


pipeline:
  run_data: true
  run_training: true   # Set to true to run the Optuna training
  run_xai: true        # NEW: Toggle for the XAI Explainer stage

training:
  model_name: "emilyalsentzer/Bio_ClinicalBERT"
  epochs: 3
  batch_size: 16
  learning_rate: 2e-5

# NEW: Settings for the SHAP explainer
explainability:
  sample_index: 0      # Which row of the test set to explain
  device: -1           # -1 for CPU (often more stable for SHAP/Transformers)

mlflow:
  experiment_name: "adr-nlp-pipeline"
  tracking_uri: "sqlite:///mlflow.db"

deployment:
  api_port: 8000

artifacts:
  raw_data_path: "data/raw/data.csv"
  enriched_data_path: "data/processed/enriched_data.csv"
  model_dir: "models"
  model_name: "final_model.pkl"

prepare:
  test_size: 0.2
  random_state: 42

train:
  learning_rate: 0.01
  n_estimators: 150
